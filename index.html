<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>Teamollo</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header__inner">
          <div class="header__top">
            <a href="#" class="header__logo"
              ><span>Team</span>ollo<span>.</span></a
            >
            <button class="header__btn">Let’s talk</button>
            <div class="header__burger">
              <span></span>
              <span></span>
            </div>
          </div>
          <div class="header__content">
            <h1 class="header__title">
              <span>Let`s Talk</span>
              <span>To Design</span>
              <span>Teamollo</span>
            </h1>
            <div>
              <div class="header__intro">
                <p class="header__intro-text">
                  Here we go a small intro paragraph that talks about our
                  company and team
                </p>
                <img
                  src="./images/long-arrow-icon.svg"
                  alt=""
                  class="header__intro-arrow"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>
